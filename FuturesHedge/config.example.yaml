# HTTP 代理地址，留空直连
proxy_url: "http://192.168.10.211:7897/"

# 持仓比例（0~1）
holding_ratio: 0.9

# 降仓触发保证金率（%）
margin_ratio_reduce_trigger: 60
# 降仓目标保证金率（%）
margin_ratio_reduce_target: 50

# 加仓触发保证金率（%）
margin_ratio_add_trigger: 45
# 加仓目标保证金率（%）
margin_ratio_add_target: 50

# 最低可用资金（USD）
min_available_usd: 20

# 不在交易范围内币种的退出金额（USDT/轮）
# 每轮发现不在 symbols 列表中的持仓币种时，挂单减仓 USDC 该金额，成交后市价平掉对应数量 USDT
# 0 表示关闭
orphan_exit_usdt: 100

# 基础降仓金额（USDT）
reduce_base_usdt: 100
# 追加降仓金额（USDT / 百分点）
reduce_step_usdt_per_ratio_point: 100

# 主循环间隔
main_loop_interval: "2m"
# 订单成交超时
fill_timeout: "1m"
# 减仓后等待
reduce_wait_interval: "1m"
# 组合单完成等待
tc_wait_interval: "3s"
# 循环步进间隔
loop_step_interval: "1s"

# 下单重试次数
retry_count: 3
# 补仓最大轮次
max_add_rounds: 10

# 交易标的
symbols:
  - symbol: "1000BONK"
    # 单次下单金额（USDT）
    usdt: 20
    # 仓位价值上限（USD）
    price: 5000

  - symbol: "1000PEPE"
    usdt: 20
    price: 5000

  - symbol: "BIO"
    usdt: 20
    price: 5000

  - symbol: "ENA"
    usdt: 20
    price: 5000

  - symbol: "NEAR"
    usdt: 20
    price: 5000

  - symbol: "TIA"
    usdt: 20
    price: 5000

  - symbol: "WIF"
    usdt: 20
    price: 5000

# 账户启动时间错位
account_stagger_interval: "10s"

# 多账户列表
accounts:
